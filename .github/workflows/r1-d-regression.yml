name: R1-D Regression

on:
  pull_request:
    branches:
      - air
  push:
    branches:
      - milestone/agentic-cinema-r1-d-eligibility-judge-experience-hardening

permissions:
  contents: read

concurrency:
  group: r1-d-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    name: Full regression (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile source and tests
        run: python -m compileall -q src scripts tests

      - name: Run full unit regression
        run: python -m unittest discover -s tests -v

      - name: Render judge demo
        run: python -m scripts.render_judge_demo

      - name: Verify generated surface parity
        run: |
          test -s build/judge-demo/index.html
          test -s docs/index.html
          sha256sum build/judge-demo/index.html docs/index.html
          cmp -s build/judge-demo/index.html docs/index.html

      - name: Verify rendered judge surface contract
        run: |
          grep -F "Recorded evidence replay" build/judge-demo/index.html
          grep -F "IBM Bob — development-process partner" build/judge-demo/index.html
          grep -F "This surface does not call live cloud services" build/judge-demo/index.html
